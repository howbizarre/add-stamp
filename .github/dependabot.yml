# Dependabot version updates are currently switched OFF in the repository settings, so
# nothing here runs — the weekly schedule below describes what would happen if they were
# turned back on, not what is happening now. The config is kept rather than deleted for
# exactly that reason.
#
# All configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
